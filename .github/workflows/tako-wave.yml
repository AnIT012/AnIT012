# 草の上でたこが波乗りする絵を、毎日作り直して output ブランチに置く（README から読む）
name: たこの波乗り
on:
  schedule:
    - cron: "0 15 * * *"   # 毎日 0:00（日本時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/tako_wave.py, tools/works_cards.py, .github/workflows/tako-wave.yml]
  pull_request:
    paths: [tools/tako_wave.py, tools/works_cards.py, .github/workflows/tako-wave.yml]
permissions:
  contents: write
concurrency:
  group: tako-wave
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 絵を作る
        run: python3 tools/tako_wave.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 代表作のカードを作る
        run: python3 tools/works_cards.py dist
      - name: output ブランチに置く
        if: github.event_name != 'pull_request'
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "たこの波乗りを更新"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
